
name: Build Lal Kitab Kundli APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Android project ZIP file not found"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d .
          echo "Project extracted"

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          build-root-directory: LalKitabKundli_Android_Project
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LalKitabKundli-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: warn
