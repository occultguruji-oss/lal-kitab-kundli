
name: Build Lal Kitab Kundli APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          unzip -o "$ZIP_FILE" -d .

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          build-root-directory: LalKitabKundli_Android
          arguments: assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LalKitabKundli-APK
          path: LalKitabKundli_Android/app/build/outputs/apk/debug/*.apk
